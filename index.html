<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Londres, connectée au monde – Géographie 4e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Overpass:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6; --paper:#FFFFFF; --ink:#152033; --muted:#4F5B6E; --line:#B8C3D0; --soft:#F3F6F9;
  --ok:#1E7A45; --ko:#B3261E;
  --m:#C2185B; --ml:#F48FB1; --mt:var(--m);
  --fs:17px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0F1724; --paper:#182234; --ink:#EDF1F6; --muted:#B4BFCD; --line:#3A4A63; --soft:#1F2B41; --mt:var(--ml); --ok:#7FD6A0; --ko:#FF9C94; }
}
:root[data-theme="dark"]{ --bg:#0F1724; --paper:#182234; --ink:#EDF1F6; --muted:#B4BFCD; --line:#3A4A63; --soft:#1F2B41; --mt:var(--ml); --ok:#7FD6A0; --ko:#FF9C94; }
/* contraste élevé */
:root.hc{ --bg:#FFFFFF; --paper:#FFFFFF; --ink:#000000; --muted:#000000; --line:#000000; --soft:#FFFFFF; --mt:var(--m); --ok:#0B5A2C; --ko:#8C1D18; }
:root.hc body{ background:#fff; color:#000; }
:root.hc a{ text-decoration:underline; }
:root.hc .step,:root.hc .qs,:root.hc .mission-head,:root.hc .slide,:root.hc .card,:root.hc .given,:root.hc .bars,:root.hc .tablewrap{ border-width:2px; border-color:#000; }
:root.hc input,:root.hc textarea{ border-color:#000; }

html{ font-size:var(--fs); scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; font-size:1rem; line-height:1.55; }
/* espacement renforcé (dyslexie, lecture facilitée) */
:root.sp body{ letter-spacing:.06em; word-spacing:.18em; line-height:1.95; }
:root.sp p,:root.sp .task,:root.sp label{ text-align:left; }
:root.sp .tracetxt{ line-height:2.5; }
h1,h2,h3,.disp{ font-family:"Overpass","Arial Narrow",Arial,sans-serif; line-height:1.2; margin:0; }
a{ color:inherit; }
button,input,textarea,select{ font:inherit; color:inherit; letter-spacing:inherit; }
:focus-visible{ outline:3px solid var(--mt); outline-offset:3px; border-radius:4px; }
.sr{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:12px; top:-60px; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:8px; z-index:100; font-weight:700; }
.skip:focus{ top:calc(8px + env(safe-area-inset-top,0px)); }
.wrap{ max-width:1000px; margin:0 auto; padding:0 18px; }

/* en-tête */
header.top{ background:var(--paper); border-bottom:1px solid var(--line); }
.top .wrap{ display:flex; align-items:center; gap:12px; padding-top:12px; padding-bottom:12px; flex-wrap:wrap; }
.top h1{ font-size:1.45rem; font-weight:900; flex:1 1 260px; }
.top h1 small{ display:block; font-family:"Atkinson Hyperlegible",sans-serif; font-weight:400; font-size:.88rem; color:var(--muted); margin-top:2px; }
.ibtn{ min-height:44px; min-width:44px; border:2px solid var(--line); background:var(--paper); border-radius:999px; padding:6px 14px; cursor:pointer; font-size:.95rem; font-weight:700; }
.ibtn:hover{ border-color:var(--ink); }
.ibtn[aria-expanded="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.ibtn.danger{ border-color:var(--ko); color:var(--ko); }
.timer{ display:flex; align-items:center; gap:6px; background:var(--soft); border:2px solid var(--line); border-radius:999px; padding:3px 4px 3px 14px; }
.timer .t{ font-family:"Overpass",sans-serif; font-weight:800; font-size:1.2rem; min-width:4.2ch; font-variant-numeric:tabular-nums; }
.timer.done .t{ color:var(--ko); }
.timer .ibtn{ min-height:38px; padding:4px 12px; }

/* panneau d'accessibilité */
#a11y{ background:var(--paper); border-bottom:1px solid var(--line); }
#a11y .wrap{ padding-top:16px; padding-bottom:18px; }
#a11y h2{ font-size:1.2rem; margin-bottom:10px; }
.a11y-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:10px 24px; }
.a11y-grid fieldset{ border:0; padding:0; margin:0; }
.a11y-grid legend{ font-weight:700; margin-bottom:4px; }
.opt{ display:flex; align-items:center; gap:10px; min-height:44px; cursor:pointer; }
.opt input{ width:22px; height:22px; accent-color:var(--ink); flex:0 0 auto; }
.opt small{ display:block; color:var(--muted); }
.seg-choice{ display:flex; flex-wrap:wrap; gap:6px; }
.seg-choice label{ display:flex; align-items:center; gap:6px; border:2px solid var(--line); border-radius:10px; padding:6px 12px; min-height:44px; cursor:pointer; }
.seg-choice input{ width:20px; height:20px; accent-color:var(--ink); }

/* navigation entre missions */
nav.picker{ display:flex; gap:8px; overflow-x:auto; padding:16px 2px 6px; }
.tab{ flex:0 0 auto; display:flex; align-items:center; gap:8px; min-height:44px; border:2px solid var(--line); background:var(--paper); border-radius:12px; padding:8px 14px; cursor:pointer; font-weight:700; }
.tab .dot{ width:12px; height:12px; border-radius:50%; background:var(--c); }
.tab[aria-current="page"]{ border-color:var(--ink); box-shadow:inset 0 -5px 0 var(--c); }

/* accueil */
.home{ margin-top:14px; }
.card{ background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:22px 24px; margin-bottom:16px; }
.card h2{ font-size:1.9rem; font-weight:900; }
.card > p{ max-width:68ch; }
.choice{ border:0; padding:0; margin:18px 0 0; }
.choice legend{ font-family:"Overpass",sans-serif; font-weight:800; font-size:1.25rem; margin-bottom:10px; }
.options{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
.option{ position:relative; display:flex; gap:12px; align-items:flex-start; border:2px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; background:var(--soft); }
.option input{ width:22px; height:22px; margin-top:3px; flex:0 0 auto; accent-color:var(--ink); }
.option:has(input:checked){ border-color:var(--ink); background:var(--paper); box-shadow:inset 6px 0 0 var(--c,var(--ink)); }
.option b{ display:block; font-size:1.05rem; }
.option span.d{ display:block; color:var(--muted); font-size:.92rem; }
.option.disabled{ opacity:.8; cursor:default; }
.startbar{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:20px; }
.msg{ color:var(--ko); font-weight:700; }

/* en-tête de mission et ligne de trajet */
.mission-head{ margin-top:14px; background:var(--paper); border-radius:18px; border:1px solid var(--line); overflow:hidden; }
.mh-top{ padding:20px 22px 6px; }
.badges{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.role{ display:inline-block; background:var(--m); color:#fff; font-weight:700; border-radius:6px; padding:3px 10px; font-size:.9rem; }
.lvl{ display:inline-block; border:2px solid var(--ink); border-radius:6px; padding:1px 8px; font-weight:700; font-size:.9rem; }
.linkbtn{ background:none; border:0; padding:6px 4px; min-height:44px; text-decoration:underline; cursor:pointer; color:var(--ink); font-size:.92rem; }
.mh-top h2{ font-size:2rem; font-weight:900; margin-top:8px; }
.mh-top p{ margin:6px 0 0; max-width:68ch; color:var(--muted); }
.route{ overflow-x:auto; padding:22px 22px 20px; }
.line{ display:flex; align-items:flex-start; min-width:max-content; list-style:none; margin:0; padding:0; }
.stop{ display:flex; flex-direction:column; align-items:center; width:120px; text-align:center; }
.stop .pin{ width:26px; height:26px; border-radius:50%; background:var(--paper); border:5px solid var(--mt); }
.stop.end .pin{ background:var(--mt); }
.stop .nm{ font-weight:700; font-size:.88rem; margin-top:6px; line-height:1.2; }
.seg{ flex:0 0 90px; position:relative; height:26px; }
.seg::before{ content:""; position:absolute; left:-47px; right:-47px; top:9px; height:8px; border-radius:4px; background:repeating-linear-gradient(90deg,var(--mt) 0 10px,transparent 10px 18px); }
.seg.ok::before{ background:var(--mt); }
.seg .ico{ position:absolute; left:50%; top:-26px; transform:translateX(-50%); font-size:1.15rem; }
.compact .stop{ width:84px; }
.compact .seg{ flex-basis:22px; }
.compact .seg::before{ left:-29px; right:-29px; }
.stop.off .pin{ border-color:var(--line); }
.stop.off .nm{ color:var(--muted); }
.seg.off::before{ background:var(--line); }
.progress{ padding:0 22px 18px; color:var(--muted); font-size:.95rem; }

/* étapes */
.steps{ list-style:none; padding:0; margin:18px 0 0; }
.step{ background:var(--paper); border:1px solid var(--line); border-left:6px solid var(--m); border-radius:14px; padding:18px 20px; margin-bottom:14px; }
.step h3{ font-size:1.2rem; font-weight:800; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.num{ flex:0 0 auto; display:inline-grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--m); color:#fff; font-size:1rem; }
.step h3 .md{ font-family:"Atkinson Hyperlegible",sans-serif; font-weight:400; font-size:.95rem; color:var(--muted); }
.task{ margin:8px 0 12px; max-width:72ch; }
.links{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.lk{ display:inline-flex; align-items:center; gap:6px; min-height:44px; text-decoration:none; font-weight:700; border:2px solid var(--mt); border-radius:10px; padding:8px 12px; background:var(--soft); }
.lk:hover{ background:var(--m); color:#fff; border-color:var(--m); }
.fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; align-items:end; }
.fields > label, .fields > .fld{ display:flex; flex-direction:column; font-size:.9rem; color:var(--muted); gap:4px; }
.fields .wide{ grid-column:1/-1; }
fieldset.fld{ border:0; padding:0; margin:0; min-width:0; }
fieldset.fld legend{ padding:0; margin-bottom:4px; }
.dur{ display:flex; gap:6px; align-items:center; }
input[type=number],input[type=text],textarea{ width:100%; min-height:44px; border:2px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--soft); }
input[type=number]{ -moz-appearance:textfield; }
input:focus,textarea:focus{ border-color:var(--mt); }
.dur input{ width:78px; }
.dur span{ color:var(--ink); font-weight:700; }
details.hint{ margin-top:12px; }
details summary{ cursor:pointer; font-weight:700; color:var(--mt); width:max-content; max-width:100%; min-height:44px; display:flex; align-items:center; }
details.hint p{ margin:4px 0 0; background:var(--soft); border-radius:10px; padding:10px 14px; max-width:72ch; }
.given{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:10px; max-width:74ch; }
.gbadge{ font-size:.82rem; font-weight:700; color:var(--muted); }
.glab{ flex:1 1 auto; }
.given small{ flex-basis:100%; color:var(--muted); font-size:.82rem; }
.onenav{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.say{ display:inline-grid; place-items:center; min-width:40px; min-height:40px; border:2px solid var(--line); border-radius:50%; background:var(--paper); cursor:pointer; font-size:1rem; vertical-align:middle; margin-left:6px; }
.say:hover{ border-color:var(--ink); }
.say.on{ background:var(--ink); color:var(--paper); }

/* totaux */
.totals{ display:flex; flex-wrap:wrap; gap:12px; margin:6px 0 18px; }
.tot{ flex:1 1 200px; background:var(--m); color:#fff; border-radius:14px; padding:14px 18px; }
.tot b{ display:block; font-family:"Overpass",sans-serif; font-size:1.7rem; font-weight:900; }

/* questions */
.qs{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:14px; }
.qs > h3{ font-size:1.3rem; font-weight:800; margin-bottom:10px; }
.q{ margin-bottom:18px; }
.q > label{ display:block; font-weight:700; margin-bottom:6px; }
.q textarea{ min-height:96px; resize:vertical; }
.words{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.word{ min-height:40px; border:2px dashed var(--mt); border-radius:999px; padding:4px 12px; font-size:.9rem; background:none; cursor:pointer; }
.word:hover{ background:var(--soft); }
.starter{ margin-top:8px; min-height:44px; border:2px solid var(--mt); background:var(--soft); border-radius:10px; padding:6px 12px; cursor:pointer; text-align:left; }
.bonus{ border-top:1px solid var(--line); padding-top:14px; }
.corr{ margin-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.cnote{ font-size:.88rem; color:var(--muted); }
.ctext{ flex-basis:100%; margin:0; border-left:6px solid var(--ok); background:var(--soft); border-radius:8px; padding:10px 14px; max-width:72ch; }
.ctext strong{ color:var(--ok); }
.doc{ margin:6px 0 12px; border:2px solid var(--line); border-radius:12px; padding:4px 14px 10px; background:var(--soft); max-width:74ch; }
.doc p{ margin:8px 0; }
.doc .src{ font-size:.85rem; color:var(--muted); }
.cmp{ margin-top:10px; }
.cmp small{ color:var(--muted); }
.actions{ display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 30px; }
.btn{ min-height:44px; border:2px solid var(--ink); border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; background:var(--ink); color:var(--paper); }
.btn.alt{ background:var(--paper); color:var(--ink); border-color:var(--line); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; z-index:60; }
.toast.show{ opacity:1; }

.teacher{ background:var(--soft); border:2px dashed var(--muted); border-radius:14px; padding:14px 18px; margin-top:14px; }
.teacher h3{ font-size:1.05rem; margin-bottom:6px; }
.teacher ul{ margin:0; padding-left:20px; }

/* bilan */
.tablewrap{ overflow-x:auto; background:var(--paper); border:1px solid var(--line); border-radius:14px; margin-top:14px; }
table{ border-collapse:collapse; width:100%; min-width:760px; }
caption{ text-align:left; padding:12px 12px 0; font-weight:700; }
th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
th{ font-family:"Overpass",sans-serif; font-weight:800; font-size:.95rem; }
td input{ min-width:90px; }
.mname{ font-weight:700; color:var(--c); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]):not(.hc) .mname{ color:var(--cl); } }
:root[data-theme="dark"]:not(.hc) .mname{ color:var(--cl); }
.unit{ display:block; color:var(--muted); font-size:.8rem; margin-top:2px; }
.bars{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-top:14px; }
.bar{ display:grid; grid-template-columns:170px 1fr 120px; gap:10px; align-items:center; margin:8px 0; }
.bar .track{ background:var(--soft); border:1px solid var(--line); border-radius:6px; height:22px; overflow:hidden; }
.bar .fill{ height:100%; background:var(--c); }
.bar .v{ font-weight:700; font-variant-numeric:tabular-nums; }

/* séance guidée */
.slide{ background:var(--paper); border:1px solid var(--line); border-left:8px solid var(--m); border-radius:16px; padding:22px 24px; margin-top:14px; }
.snum{ color:var(--mt); font-weight:700; }
.slide h3{ font-size:1.8rem; font-weight:900; margin:4px 0 10px; }
.screen{ background:var(--soft); border-radius:10px; padding:10px 14px; color:var(--muted); max-width:75ch; }
.gq{ font-size:1.35rem; font-weight:700; max-width:60ch; margin:16px 0 14px; }
.ga{ font-size:1.2rem; border-left:6px solid var(--ok); background:var(--soft); border-radius:10px; padding:12px 16px; max-width:70ch; }
.tracetxt{ font-size:1.25rem; line-height:2.2; max-width:65ch; }
.drop{ display:inline-block; min-width:7.5em; min-height:1.8em; line-height:1.5; vertical-align:middle; border:2px dashed var(--mt); border-radius:8px; padding:0 8px; margin:2px; background:var(--soft); color:var(--mt); font-weight:700; cursor:pointer; }
.drop.full{ border-style:solid; touch-action:none; user-select:none; }
.drop.hover{ background:var(--m); color:#fff; }
.drop.ok{ border-color:var(--ok); color:var(--ok); }
.drop.ko{ border-color:var(--ko); color:var(--ko); border-style:double; border-width:4px; }
.drop.ok::after{ content:" ✓"; }
.drop.ko::after{ content:" ✗"; }
.bank{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; padding:14px; border-radius:12px; background:var(--soft); border:1px solid var(--line); min-height:60px; list-style:none; }
.chip{ display:inline-flex; align-items:center; min-height:44px; background:var(--paper); border:2px solid var(--mt); border-radius:999px; padding:6px 16px; font-weight:700; font-size:1.05rem; cursor:grab; touch-action:none; user-select:none; }
.chip.sel,.chip[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); outline:3px solid var(--mt); }
.chip.ghost{ position:fixed; z-index:50; pointer-events:none; transform:translate(-50%,-60%); box-shadow:0 6px 16px rgba(0,0,0,.25); }
.tstat{ font-weight:700; margin:10px 0 0; min-height:1.5em; }
.dl{ background:var(--paper); border:2px solid var(--ink); border-radius:14px; padding:18px 20px; margin:0 0 30px; }
.dl h3{ font-size:1.25rem; margin-bottom:6px; }
.dl ul{ margin:6px 0 12px; }
.panneau{ margin-top:12px; padding:12px 16px; border:2px dashed var(--line); border-radius:12px; background:var(--soft); }
.panneau.alerte{ border-color:var(--ko); }
.filebtn{ display:inline-flex; align-items:center; }
.filebtn input{ position:absolute; opacity:0; width:1px; height:1px; }
.filebtn:focus-within{ outline:3px solid var(--mt); outline-offset:3px; }
.part{ border-top:1px dashed var(--line); padding:12px 0 6px; }
.plab{ display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:8px; }
.pname{ font-weight:700; }
.plab .lk{ min-height:40px; padding:6px 10px; font-size:.95rem; }
.calc{ font-weight:700; background:var(--soft); border-left:5px solid var(--mt); border-radius:8px; padding:8px 12px; margin:10px 0 4px; }
.subtot{ font-weight:700; font-size:1.05rem; border-top:2px solid var(--line); padding-top:10px; margin:10px 0; }
fieldset.choices{ border:0; padding:0; margin:0 0 6px; }
fieldset.choices > legend{ font-weight:700; margin-bottom:6px; }
.choice-box{ border:2px solid var(--line); border-radius:12px; padding:6px 14px 4px; margin-bottom:10px; }
.choice-box.on{ border-color:var(--mt); box-shadow:inset 6px 0 0 var(--m); }
.snav{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:14px; }
.dots{ display:flex; gap:4px; }
.sdot{ width:36px; height:36px; border:0; background:none; padding:0; cursor:pointer; display:grid; place-items:center; }
.sdot::before{ content:""; width:14px; height:14px; border-radius:50%; border:2px solid var(--mt); }
.sdot[aria-current="step"]::before{ background:var(--mt); }

footer{ color:var(--muted); font-size:.9rem; padding:10px 0 30px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
footer label{ display:flex; align-items:center; gap:6px; }
footer input{ width:130px; }

@media (max-width:560px){ .bar{ grid-template-columns:1fr 100px; } .bar .n{ grid-column:1/-1; } .mh-top h2,.card h2{ font-size:1.6rem; } .slide h3{ font-size:1.45rem; } }
:root.calm *,:root.calm *::before{ transition:none!important; animation:none!important; scroll-behavior:auto!important; }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important; } }
@media print{ header.top,#a11y,nav.picker,footer,.actions,.say{ display:none!important; } }
</style>
</head>
<body>
<a class="skip" href="#view">Aller au contenu</a>
<header class="top">
  <div class="wrap">
    <h1>Londres, connectée au monde
      <small>Géographie 4e · Programmez votre trajet depuis La Grand-Combe</small></h1>
    <button class="ibtn" id="a11yBtn" aria-expanded="false" aria-controls="a11y"><span aria-hidden="true">👁️ </span>Affichage et lecture</button>
    <div class="timer" id="timer">
      <span class="sr">Minuteur :</span><span class="t" id="tval" role="timer" aria-live="off">30:00</span>
      <button class="ibtn" id="tgo">Démarrer</button>
      <button class="ibtn" id="tplus" aria-label="Ajouter 5 minutes">+5 min</button>

/* ---------- état ---------- */
const KEY = "londres-4e-v3";
let S = {};
try{ S = JSON.parse(localStorage.getItem(KEY)) || JSON.parse(localStorage.getItem("londres-4e-v1")) || {}; }catch(e){ S = {}; }
S.m = S.m || {}; S.bilan = S.bilan || {}; S.focus = S.focus || {};
S.a11y = Object.assign({fs:0, theme:"auto", hc:false, sp:false, tts:false, slow:false, one:false, calm:false, notimer:false}, S.a11y||{});
if(!S.level){ S.cur = "home"; }
S.cur = S.cur || "home";
let teacher = false;
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const ms = id => (S.m[id] = S.m[id] || {steps:{}, q:{}});
const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;

(function(){
  if(!S.ref){ const d=new Date(); d.setDate(d.getDate()+21); while(d.getDay()!==2) d.setDate(d.getDate()+1); S.ref=d.toISOString().slice(0,10); save(); }
  document.getElementById("refdate").textContent = new Date(S.ref+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
})();

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic = e => `<span aria-hidden="true">${e}</span>`;
const fmt = min => {
  if(!min) return "—";
  const h = Math.floor(min/60), m = min%60;
  let s = (h?h+" h ":"") + (m?String(m).padStart(h?2:1,"0")+" min":"");
  if(h>=24){ const j=Math.floor(h/24), r=h%24; s += ` (environ ${j} j ${r} h)`; }
  return s.trim();
};
const eur = p => p.toLocaleString("fr-FR")+" €";
const link = l => `<a class="lk" href="${l.url}" target="_blank" rel="noopener">${esc(l.label)}<span class="sr"> (s’ouvre dans un nouvel onglet)</span> <span aria-hidden="true">↗</span></a>`;
const say = (text, what) => (S.a11y.tts && TTS) ? `<button class="say" type="button" data-say="${esc(text)}" aria-label="Écouter ${esc(what||"le texte")}">${ic("🔊")}</button>` : "";
const lvl = () => S.level || 1;
const LV = () => LEVELS[lvl()-1];

/* étape vue selon le parcours */
/* étapes : lignes (une par outil), choix, calculs automatiques */
function stepParts(s){
  if(s.choices) return s.choices.flatMap(c=>c.parts.map((p,j)=>({p, key:c.id+"-"+j, cid:c.id})));
  return (s.parts||[]).map((p,j)=>({p, key:String(j), cid:null}));
}
function lvGiven(p){
  const L=lvl(); if(!p.lv) return null;
  if(L>=3 && p.lv[3]) return p.lv[3];
  if(L>=2 && p.lv[2] && !(p.lvOnly2 && L>=3)) return p.lv[2];
  return null;
}
function partVal(p, v){
  v = v||{};
  const isCalc = p.calcTruck||p.calcCar;
  const calc = (km,car) => p.calcTruck ? {m:Math.round(car*1.5), p:Math.round(km*2), km, car} : {m:car, p:Math.round(km*0.15), km, car};
  if(p.fixed) return {m:p.fixed.m||0, p:p.fixed.p||0, given:true, done:true, src:p.src};
  const g = lvGiven(p);
  if(g){ const src="donnée fournie pour votre parcours"; return isCalc ? {...calc(g.km,g.car), given:true, done:true, src} : {m:g.m||0, p:g.p||0, given:true, done:true, src}; }
  const dur = (+v.h||0)*60+(+v.m||0);
  if(isCalc){ const km=+v.km||0; return {...calc(km,dur), done: km>0 && dur>0}; }
  return {m:dur, p: p.fixP!=null ? p.fixP : (+v.p||0), done: dur>0};
}
function stepVal(M,i){
  const s=M.steps[i], sv=ms(M.id).steps[i]||{}, parts=sv.parts||{};
  let list=stepParts(s);
  if(s.choices) list=list.filter(x=>x.cid===sv.choice);
  let m=0,p=0,done=list.length>0,given=list.length>0;
  list.forEach(x=>{ const r=partVal(x.p, parts[x.key]); m+=r.m||0; p+=r.p||0; if(!r.done) done=false; if(!r.given) given=false; });
  return {m,p,done,given, needChoice: !!s.choices && !sv.choice};
}
function totals(M){
  let t=0,p=0,done=0;
  M.steps.forEach((s,i)=>{ const v=stepVal(M,i); t+=v.m; p+=v.p; if(v.done) done++; });
  return {t,p,done};
}
const vals = r => [r.km?r.km.toLocaleString("fr-FR")+" km":"", r.m?fmt(r.m):"", r.p?eur(r.p):""].filter(Boolean).join(" · ");
function stepDesc(M,i){
  const s=M.steps[i], sv=ms(M.id).steps[i]||{}, parts=sv.parts||{}, out=[];
  let list=stepParts(s);
  if(s.choices){ const c=s.choices.find(c=>c.id===sv.choice); out.push(c?`Solution choisie : ${c.label}`:"Solution : pas encore choisie"); list=list.filter(x=>x.cid===sv.choice); }
  list.forEach(x=>{ const r=partVal(x.p, parts[x.key]); out.push(`${x.p.label} : ${vals(r)||"—"}${x.p.calcTruck?" (durée en camion)":""}${r.given?" – donnée fournie":""}`); });
  if(sv.n) out.push("Remarques : "+sv.n);
  return out;
}
function setColor(M){
  const r=document.documentElement.style;
  r.setProperty("--m", M?M.color:"#152033"); r.setProperty("--ml", M?M.light:"#EDF1F6");
}

/* ---------- affichage (accessibilité) ---------- */
function applyA11y(){
  const A=S.a11y, root=document.documentElement;
  root.style.setProperty("--fs", [17,20,23][A.fs]+"px");
  root.classList.toggle("hc", A.hc); root.classList.toggle("sp", A.sp); root.classList.toggle("calm", A.calm);
  if(A.hc) root.setAttribute("data-theme","light");
  else if(A.theme==="auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", A.theme);
  document.getElementById("timer").hidden = A.notimer;
  document.querySelectorAll('#a11y input[name="fs"]').forEach(i=>i.checked = +i.value===A.fs);
  document.querySelectorAll('#a11y input[name="theme"]').forEach(i=>{ i.checked = i.value===A.theme; i.disabled = A.hc; });
  document.querySelectorAll('#a11y input[data-a]').forEach(i=>i.checked = !!A[i.dataset.a]);
  if(!TTS){ const b=document.getElementById("ttsBox"); b.disabled=true; document.getElementById("ttsNote").textContent="La lecture à voix haute n’est pas disponible dans ce navigateur."; }
}
document.getElementById("a11yBtn").onclick = e=>{
  const p=document.getElementById("a11y"), open=p.hidden; p.hidden=!open; e.currentTarget.setAttribute("aria-expanded", open);
  if(open) p.querySelector("input").focus();
};
document.getElementById("a11y").addEventListener("change", e=>{
  const t=e.target;
  if(t.name==="fs") S.a11y.fs=+t.value;
  else if(t.name==="theme") S.a11y.theme=t.value;
  else if(t.dataset.a) S.a11y[t.dataset.a]=t.checked;
  save(); applyA11y();
  if(["tts","one"].includes(t.dataset.a)) render(false);
});
document.getElementById("a11y").addEventListener("keydown", e=>{ if(e.key==="Escape"){ document.getElementById("a11yBtn").click(); document.getElementById("a11yBtn").focus(); } });

/* lecture à voix haute */
let speakingBtn=null;
document.addEventListener("click", e=>{
  const b=e.target.closest(".say"); if(!b) return;
  if(speakingBtn===b && speechSynthesis.speaking){ speechSynthesis.cancel(); b.classList.remove("on"); speakingBtn=null; return; }
  speechSynthesis.cancel(); document.querySelectorAll(".say.on").forEach(x=>x.classList.remove("on"));
  const u=new SpeechSynthesisUtterance(b.dataset.say.replace(/→/g," vers ").replace(/≈/g," environ ").replace(/…/g," ... "));
  u.lang="fr-FR"; u.rate = S.a11y.slow ? .8 : 1;
  const fr = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith("fr")); if(fr) u.voice=fr;
  u.onend = ()=>{ b.classList.remove("on"); speakingBtn=null; };
  b.classList.add("on"); speakingBtn=b; speechSynthesis.speak(u);
});

function renderPicker(){

function go(id){ S.cur=id; save(); speechSynthesis?.cancel?.(); render(true); window.scrollTo({top:0}); }

function render(moveFocus){
  renderPicker();
  if(S.cur==="home") renderHome();

  if(moveFocus){ const h=document.querySelector("#view h2"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } }
}

/* ---------- mission de recherche ---------- */
function routeHTML(M){
  let h = '<ol class="line" aria-label="Étapes du trajet">';
  M.stops.forEach((s,i)=>{
    h += `<li class="stop ${i===M.stops.length-1?'end':''}"><span class="pin" aria-hidden="true"></span><span class="nm">${esc(s)}</span></li>`;
    if(i<M.stops.length-1){ const ok=stepVal(M,i).done; h += `<li class="seg ${ok?'ok':''}" aria-hidden="true"><span class="ico">${M.steps[i].mode||""}</span></li>`; }
  });
  return h+"</ol>";
}
function progressText(M,T){ return `${T.done} étape${T.done>1?"s":""} complétée${T.done>1?"s":""} sur ${M.steps.length}. Le trait devient plein quand une étape est remplie.`; }

function calcText(p,r){
  if(!r.done) return "Calcul automatique : remplissez la distance et la durée.";
  return p.calcTruck
    ? `Calcul automatique : durée en camion ≈ ${fmt(r.m)} (durée voiture × 1,5) · prix ≈ ${eur(r.p)} (${r.km.toLocaleString("fr-FR")} km × 2 €)`
    : `Calcul automatique : essence ≈ ${eur(r.p)} (${r.km.toLocaleString("fr-FR")} km × 0,15 €)`;
}
function subText(M,i){
  const v=stepVal(M,i);
  if(v.needChoice) return `Sous-total de l’étape ${i+1} : choisissez une solution.`;
  return `Sous-total de l’étape ${i+1} : ${v.m?fmt(v.m):"—"} · ${v.p?eur(v.p):"—"}`;
}
function partHTML(M,i,x,v){
  v = v||{};
  const p=x.p, r=partVal(p,v), id=`s${i}_${x.key}`, n=i+1;
  let h=`<div class="part"><div class="plab"><span class="pname">${esc(p.label)}</span>${p.link?link(p.link):""}</div>`;
  if(r.given){
    h+=`<div class="given"><span class="gbadge">${ic("🔒")} Donnée fournie</span><b>${vals(r)}</b><small>Source : ${esc(r.src||p.src)}${p.calcTruck?" · durée en camion et prix déjà calculés":""} · compté dans le total</small></div>`;
  } else {
    const dur = `<fieldset class="fld"><legend>${p.calcTruck||p.calcCar?"Durée indiquée par Google Maps":"Durée"}</legend><div class="dur">
        <input type="number" min="0" inputmode="numeric" data-s="${i}" data-p="${x.key}" data-k="h" value="${esc(v.h)}" aria-label="${esc(p.label)} : heures"><span aria-hidden="true">h</span>
        <input type="number" min="0" max="59" inputmode="numeric" data-s="${i}" data-p="${x.key}" data-k="m" value="${esc(v.m)}" aria-label="${esc(p.label)} : minutes"><span aria-hidden="true">min</span></div></fieldset>`;
    if(p.calcTruck||p.calcCar){
      h+=`<div class="fields"><label for="${id}km">Distance (en km)<input type="number" min="0" inputmode="numeric" id="${id}km" data-s="${i}" data-p="${x.key}" data-k="km" value="${esc(v.km)}"></label>${dur}</div>
        <p class="calc" id="${id}c" aria-live="polite">${calcText(p,r)}</p>`;
    } else {
      h+=`<div class="fields">${dur}${p.fixP!=null
        ? `<div class="fld"><span>Prix</span><span class="given" style="margin:0"><span class="gbadge">${ic("🔒")} Donnée fournie</span><b>${eur(p.fixP)}</b></span></div>`
        : `<label for="${id}p">Prix (en €)<input type="number" id="${id}p" min="0" step="0.5" inputmode="decimal" data-s="${i}" data-p="${x.key}" data-k="p" value="${esc(v.p)}"></label>`}</div>`;
    }
  }
  return h+`</div>`;
}
function stepHTML(M,s,i,st){
  const sv=st.steps[i]||{}, parts=sv.parts||{}, n=i+1;
  const byChoice = c => c.parts.map((p,j)=>partHTML(M,i,{p,key:c.id+"-"+j,cid:c.id}, parts[c.id+"-"+j])).join("");
  return `<li class="step" id="step${i}">
    <h3><span class="num" aria-hidden="true">${n}</span><span class="sr">Étape ${n} :</span> ${esc(M.stops[i])} <span aria-hidden="true">→</span><span class="sr"> vers </span> ${esc(M.stops[i+1])} <span class="md">${ic(s.mode)} ${esc(s.md)}</span></h3>
    <p class="task">${esc(s.task)}${say(s.task,"la consigne de l’étape "+n)}</p>
    ${s.choices
      ? `<fieldset class="choices"><legend>Quelle solution choisissez-vous ?</legend>${s.choices.map(c=>`<div class="choice-box ${sv.choice===c.id?"on":""}" data-box="${i}-${c.id}">
          <label class="opt"><input type="radio" name="ch${i}" value="${c.id}" data-choice="${i}" ${sv.choice===c.id?"checked":""}><b>${esc(c.label)}</b></label>${byChoice(c)}</div>`).join("")}</fieldset>`
      : (s.parts||[]).map((p,j)=>partHTML(M,i,{p,key:String(j)}, parts[String(j)])).join("")}
    ${(s.infos||[]).map(f=>`<div class="given"><span class="gbadge">${ic("🔒")} Donnée fournie</span><span class="glab">${esc(f.label)}</span><small>Source : ${esc(f.src)}</small></div>`).join("")}
    <p class="subtot" id="sub${i}" aria-live="polite">${subText(M,i)}</p>
    <div class="fields"><label class="wide" for="n${i}">Remarques (changements, transports utilisés…)<input type="text" id="n${i}" data-s="${i}" data-k="n" value="${esc(sv.n)}"></label></div>
    <details class="hint" ${lvl()>=3?"open":""}><summary>Coup de pouce</summary><p>${esc(s.hint)}${say(s.hint,"le coup de pouce")}</p></details>
  </li>`;
}
const MINC = 15;
function corrHTML(id, c, val){
  if(!c) return "";
  const ok = (val||"").trim().length>=MINC;
  return `<div class="corr" data-c="${id}">
    <button class="btn alt cbtn" type="button" data-c="${id}" aria-expanded="false" aria-controls="ct${id}" ${ok?"":"disabled"} aria-describedby="cn${id}">Voir la correction</button>
    <span class="cnote" id="cn${id}">${ok?"":"Écrivez d’abord votre réponse pour débloquer la correction."}</span>
    <p class="ctext" id="ct${id}" hidden><strong>Correction : </strong>${esc(c)}${say(c,"la correction")}</p></div>`;
}
function compareHTML(M){
  const T = totals(M);
  const other = id => { const O=MISSIONS.find(m=>m.id===id), t=totals(O); return t.t>150? {d:fmt(t.t), p:t.p? eur(t.p):"?"} : null; };
  const tr = other("train"), av = other("avion");
  return `<div class="cmp"><div class="tablewrap"><table style="min-width:420px"><caption>Pour comparer</caption><thead><tr><th scope="col">Trajet</th><th scope="col">Durée</th><th scope="col">Prix aller simple</th></tr></thead><tbody>
   <tr><th scope="row">${ic("🚌")} Votre trajet en bus</th><td>${fmt(T.t)}</td><td>${T.p? eur(T.p):"—"}</td></tr>
   <tr><th scope="row">${ic("🚄")} Cadres en train</th><td>${tr?tr.d:"environ 9 h"}</td><td>${tr?tr.p:"150 à 350 €"}</td></tr>
   <tr><th scope="row">${ic("✈️")} Touristes en avion</th><td>${av?av.d:"environ 7 h"}</td><td>${av?av.p:"110 à 200 €"}</td></tr>
   </tbody></table></div>
   <small>Repères moyens trouvés sur les sites. Demandez aussi ses résultats au groupe voisin.</small></div>`;
}

function renderMission(M){
  setColor(M);
  const st = ms(M.id), T = totals(M), one = S.a11y.one;
  const cur = Math.min(S.focus[M.id]||0, M.steps.length-1);
  let h = `<div class="mission-head">
    <div class="mh-top"><div class="badges"><span class="role">${ic(M.icon)} ${esc(M.role)}</span><span class="lvl">${LV().name} · ${LV().tag}</span><button class="linkbtn" id="chg">Changer de mission ou de parcours</button></div>
    <h2 id="mtitle">${esc(M.title)}</h2><p>${esc(M.intro)}${say(M.intro,"la présentation de la mission")}</p></div>
    <div class="route" id="route">${routeHTML(M)}</div>
    <p class="progress" id="prog" aria-live="polite">${progressText(M,T)}</p>
  </div>`;
  if(teacher) h += `<div class="teacher"><h3>Repères enseignant (ordres de grandeur, à vérifier le jour J)</h3><ul>${M.teacher.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`;
  h += `<ol class="steps" aria-label="Étapes à compléter">`;
  M.steps.forEach((s,i)=>{ if(!one || i===cur) h += stepHTML(M,s,i,st); });
  h += `</ol>`;
  if(one) h += `<div class="onenav"><button class="btn alt" id="prevStep" ${cur===0?"disabled":""}>Étape précédente</button><span>Étape ${cur+1} sur ${M.steps.length}</span><button class="btn" id="nextStep" ${cur===M.steps.length-1?"disabled":""}>Étape suivante</button></div>`;
  h += `<div class="totals" aria-live="polite">
    <div class="tot">Durée totale<b id="tt">${fmt(T.t)}</b></div>
    <div class="tot">Prix total (aller simple)<b id="tp">${T.p? eur(T.p):"—"}</b></div>
  </div>
  <section class="qs" aria-labelledby="qsTitle"><h3 id="qsTitle">Réfléchir en géographe</h3>
    ${M.questions.map((q,i)=>`<div class="q"><label for="q${i}">${esc(q.q)}</label>${say(q.q,"la question")}
      ${lvl()>=2&&q.st?`<button type="button" class="starter" data-q="${i}" data-st="${esc(q.st)}">${ic("✏️")} Commencer ma phrase : « ${esc(q.st)} »</button>`:""}
      <textarea id="q${i}" data-q="${i}">${esc(st.q[i])}</textarea>
      ${q.hint?`<details class="hint" ${lvl()>=3?"open":""}><summary>Coup de pouce</summary><p>${esc(q.hint)}</p></details>`:""}
      ${q.compare?compareHTML(M):""}
      ${q.words?`<div class="words" role="group" aria-label="Mots utiles à ajouter">${q.words.map(w=>`<button type="button" class="word" data-q="${i}" data-w="${esc(w)}" aria-label="Ajouter « ${esc(w)} » à la réponse">+ ${esc(w)}</button>`).join("")}</div>`:""}
      ${corrHTML(i, q.c, st.q[i])}
    </div>`).join("")}
    ${lvl()<3 && M.bonus ? `<div class="q bonus"><label for="qb">${ic("⭐")} Défi si vous avez fini : ${esc(M.bonus)}</label>${say(M.bonus,"le défi")}
      ${M.bonusDoc?`<details class="doc"><summary>${ic("📄")} ${esc(M.bonusDoc.title)}</summary>${say(M.bonusDoc.paras.join(" "),"le document")}${M.bonusDoc.paras.map(p=>`<p>${esc(p)}</p>`).join("")}<p class="src">Sources : ${M.bonusDoc.src.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}<span class="sr"> (s’ouvre dans un nouvel onglet)</span></a>`).join(" ; ")}</p></details>`:""}
      <textarea id="qb" data-q="b">${esc(st.q.b)}</textarea>
      ${corrHTML("b", M.bonusC, st.q.b)}
    </div>` : ""}
  </section>
  <section class="dl" aria-labelledby="rendT"><h3 id="rendT">${ic("📤")} Rendre notre travail</h3>
    <label for="eleveM">Vos noms et votre classe</label>
    <input type="text" id="eleveM" class="eleve" autocomplete="off" placeholder="Exemple : Léa Martin, Tom Petit – 4eB" value="${esc(S.eleve)}" style="max-width:520px;margin:4px 0 12px">
    <div class="actions" style="margin:0">
      <button class="btn" id="telecharger" aria-expanded="false" aria-controls="choixFormat">Télécharger nos réponses</button>
      <button class="btn alt" id="copy">Copier notre fiche</button>
      <button class="btn alt" id="toBilan">Voir la mise en commun</button>
    </div>
    <div class="panneau" id="choixFormat" hidden>
      <p><b>Dans quel format ?</b></p>
      <div class="actions" style="margin:0">
        <button class="btn" id="dlDocx">${ic("📄")} Document Word (.docx)</button>
        <button class="btn" id="dlPdf">${ic("📑")} PDF</button>
        <button class="btn alt" id="dlAnnuler">Annuler</button>
      </div>
      <p class="cnote">Pour le PDF, une fenêtre d’impression s’ouvre : choisissez « Enregistrer au format PDF » comme imprimante, puis cliquez sur « Enregistrer ».</p>
    </div>
    <p class="cnote" id="fbFin" role="status"></p>
  </section>
  <section class="dl" aria-labelledby="svT"><h3 id="svT">${ic("💾")} Pas fini ? Sauvegardez votre travail</h3>
    <p>Téléchargez une sauvegarde à la fin de la séance, puis rechargez-la la prochaine fois pour reprendre là où vous en étiez, même sur un autre ordinateur.</p>
    ${saveUI("m")}
  </section>
`;
  const view = document.getElementById("view"); view.innerHTML = h;
  bindEleve(view); bindSave(view,"m");
  const tb=document.getElementById("telecharger"), cf=document.getElementById("choixFormat"), fb=document.getElementById("fbFin");
  tb.onclick=()=>{ cf.hidden=!cf.hidden; tb.setAttribute("aria-expanded",!cf.hidden); if(!cf.hidden) document.getElementById("dlDocx").focus(); };
  document.getElementById("dlAnnuler").onclick=()=>{ cf.hidden=true; tb.setAttribute("aria-expanded","false"); tb.focus(); };
  document.getElementById("dlDocx").onclick=()=>{
    try{ dlBlob(makeDocx(M), `londres-${M.id}-${slug()}.docx`); fb.textContent="Fichier Word téléchargé : déposez-le dans le devoir Éléa."; }
    catch(e){ fb.textContent="Le téléchargement n’a pas marché : utilisez plutôt « Copier notre fiche »."; } };
  document.getElementById("dlPdf").onclick=()=>{ printRecap(M); fb.textContent="Dans la fenêtre d’impression, choisissez « Enregistrer au format PDF »."; };

  document.getElementById("chg").onclick=()=>{ S.pickM=M.id; go("home"); };
  view.querySelectorAll("input[data-s]").forEach(inp=>inp.oninput=()=>{
    const i=inp.dataset.s; st.steps[i]=st.steps[i]||{};
    if(inp.dataset.p!==undefined){ const P=st.steps[i].parts=st.steps[i].parts||{}; P[inp.dataset.p]=P[inp.dataset.p]||{}; P[inp.dataset.p][inp.dataset.k]=inp.value; }
    else st.steps[i][inp.dataset.k]=inp.value;
    save(); refresh(M);
  });
  view.querySelectorAll("input[data-choice]").forEach(r=>r.onchange=()=>{
    const i=r.dataset.choice; st.steps[i]=st.steps[i]||{}; st.steps[i].choice=r.value; save();
    view.querySelectorAll(`[data-box^="${i}-"]`).forEach(b=>b.classList.toggle("on", b.dataset.box===`${i}-${r.value}`));
    refresh(M);
  });
  view.querySelectorAll("textarea[data-q]").forEach(t=>t.addEventListener("input",()=>{ st.q[t.dataset.q]=t.value; save(); updCorr(view,t); }));
  view.querySelectorAll(".word").forEach(b=>b.onclick=()=>{
    const t=document.getElementById("q"+b.dataset.q); t.value=(t.value+(t.value&&!/\s$/.test(t.value)?" ":"")+b.dataset.w).trimStart(); t.dispatchEvent(new Event("input")); t.focus();
  });
  view.querySelectorAll(".starter").forEach(b=>b.onclick=()=>{
    const t=document.getElementById("q"+b.dataset.q); if(!t.value.trim()) t.value=b.dataset.st+" "; t.dispatchEvent(new Event("input")); t.focus(); const k=t.value.indexOf("…"); if(k>-1) t.setSelectionRange(k,k+1);
  });
  view.querySelectorAll(".cbtn").forEach(b=>b.onclick=()=>{
    const p=document.getElementById("ct"+b.dataset.c); p.hidden=!p.hidden; b.setAttribute("aria-expanded", !p.hidden); b.textContent=p.hidden?"Voir la correction":"Masquer la correction";
  });
  if(one){
    const mv=d=>{ S.focus[M.id]=cur+d; save(); renderMission(M); document.querySelector(".step h3")?.setAttribute("tabindex","-1"); document.querySelector(".step h3")?.focus(); };
    document.getElementById("prevStep").onclick=()=>mv(-1); document.getElementById("nextStep").onclick=()=>mv(1);
  }
  document.getElementById("copy").onclick=()=>copyFiche(M);
  document.getElementById("toBilan").onclick=()=>go("bilan");
}
function updCorr(view,t){
  const box = view.querySelector(`.corr[data-c="${t.dataset.q}"]`); if(!box) return;
  const ok = t.value.trim().length>=MINC, b=box.querySelector(".cbtn");
  if(b.disabled===!ok) return;
  b.disabled=!ok; box.querySelector(".cnote").textContent = ok ? "" : "Écrivez d’abord votre réponse pour débloquer la correction.";
  if(ok) toast("Correction disponible.");
}
function refresh(M){
  const T=totals(M);
  document.getElementById("tt").textContent=fmt(T.t);
  document.getElementById("tp").textContent=T.p? eur(T.p):"—";
  document.getElementById("route").innerHTML=routeHTML(M);
  document.getElementById("prog").textContent=progressText(M,T);
  M.steps.forEach((s,i)=>{
    const e=document.getElementById("sub"+i); if(e) e.textContent=subText(M,i);
    const sv=ms(M.id).steps[i]||{};
    stepParts(s).forEach(x=>{ const c=document.getElementById(`s${i}_${x.key}c`); if(c) c.textContent=calcText(x.p, partVal(x.p,(sv.parts||{})[x.key])); });
  });
}

function copyFiche(M){
  const st=ms(M.id), T=totals(M);
  let t=`${M.title} (${M.role}) – ${LV().name}\nDate de référence : ${document.getElementById("refdate").textContent}\n\n`;
  M.steps.forEach((s,i)=>{ const v=stepVal(M,i);
    t+=`${i+1}. ${M.stops[i]} → ${M.stops[i+1]} (${s.md}) – sous-total : ${v.m?fmt(v.m):"—"} · ${v.p?eur(v.p):"—"}\n`;
    stepDesc(M,i).forEach(l=>{ t+=`   – ${l}\n`; }); });
  t+=`\nDurée totale : ${fmt(T.t)}\nPrix total : ${T.p? T.p+" €":"—"}\n\n`;
  M.questions.forEach((q,i)=>{ t+=`${q.q}\n→ ${st.q[i]||"…"}\n\n`; });
  if(st.q.b) t+=`Défi : ${M.bonus}\n→ ${st.q.b}\n`;
  const done=()=>toast("Fiche copiée : collez-la dans votre document (Ctrl+V).");
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done)); else fallbackCopy(t,done);
}
function fallbackCopy(t,cb){ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand("copy"); cb();}catch(e){ toast("Copie impossible : sélectionnez le texte à la main."); } a.remove(); }
function toast(msg){ const e=document.getElementById("toast"); e.textContent=msg; e.classList.add("show"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("show"),3500); }

/* ---------- séance guidée (navire) ---------- */
function renderGuided(M){
  setColor(M);
  S.guide = Math.min(Math.max(S.guide||0,0), M.slides.length-1);
  const k = S.guide, sl = M.slides[k];
  let line='<ol class="line compact" aria-label="Trajet du conteneur">';
  M.stops.forEach((st,i)=>{
    const vis = i<=sl.upto;
    line += `<li class="stop ${i===M.stops.length-1?'end':''} ${vis?'':'off'}"><span class="pin" aria-hidden="true"></span><span class="nm">${vis?esc(st):'<span aria-hidden="true">?</span><span class="sr">étape cachée</span>'}</span></li>`;
    if(i<M.stops.length-1) line += `<li class="seg ${i<sl.upto?'ok':'off'}" aria-hidden="true"><span class="ico">${i<sl.upto?(i===M.stops.length-2?"🚚":"🚢"):""}</span></li>`;
  });
  line+='</ol>';
  let body;
  if(sl.trace){
    let n=0;
    const txt = esc(sl.text).replace(/\[([^\]]+)\]/g,(m,w)=>`<span class="drop" data-i="${n}" data-a="${w}" role="button" tabindex="0" aria-label="Trou ${++n}, vide"></span>`);
    body = `<p class="sr" id="dndHelp">Pour remplir un trou : choisissez une étiquette avec Entrée, puis choisissez un trou avec Entrée. On peut aussi glisser les étiquettes à la souris ou au doigt.</p>
      <p class="tracetxt" aria-describedby="dndHelp">${txt}</p>${say(sl.text.replace(/\[[^\]]+\]/g,"blanc"),"le texte à trous")}
      <ul class="bank" id="bank" aria-label="Étiquettes à placer"></ul>
      <p class="tstat" id="tstat" role="status"></p>
      <div class="actions" style="margin:12px 0 0"><button class="btn" id="chkT">Vérifier</button><button class="btn alt" id="rstT">Recommencer</button><button class="btn alt" id="allB">Tout révéler</button></div>`;
  } else {
    body = `<p class="gq">${esc(sl.q)}${say(sl.q,"la question")}</p>
      <button class="btn" id="showA" aria-expanded="false" aria-controls="ga">Afficher la réponse</button>
      <p class="ga" id="ga" hidden>${esc(sl.a)}${say(sl.a,"la réponse")}</p>`;
  }
  let h = `<div class="mission-head">
    <div class="mh-top"><div class="badges"><span class="role">${ic(M.icon)} ${esc(M.role)}</span></div><h2>${esc(M.title)}</h2><p>${esc(M.intro)}</p></div>
    <div class="route">${line}</div></div>
  ${teacher?`<div class="teacher"><h3>Repères enseignant</h3><ul>${M.teacher.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
  <section class="slide" aria-labelledby="slTitle">
    <p class="snum" style="margin:0">Étape ${k+1} sur ${M.slides.length}</p>
    <h3 id="slTitle">${esc(sl.title)}</h3>
    <p class="screen">${ic("🖥️")} <span class="sr">À l’écran : </span>${esc(sl.screen)}</p>
    ${sl.links&&sl.links.length?`<div class="links">${sl.links.map(link).join("")}</div>`:""}
    ${body}
  </section>
  <nav class="snav" aria-label="Étapes de la séance">
    <button class="btn alt" id="prevS" ${k===0?"disabled":""}>Étape précédente</button>
    <span class="dots">${M.slides.map((_,i)=>`<button class="sdot" data-k="${i}" ${i===k?'aria-current="step"':""} aria-label="Étape ${i+1} : ${esc(M.slides[i].title)}"></button>`).join("")}</span>
    <button class="btn" id="nextS" ${k===M.slides.length-1?"disabled":""}>Étape suivante</button>
  </nav>`;
  const view=document.getElementById("view"); view.innerHTML=h;
  const goS = (x,focusTitle=true) => { S.guide=x; save(); speechSynthesis?.cancel?.(); renderGuided(M); if(focusTitle){ const t=document.getElementById("slTitle"); t.setAttribute("tabindex","-1"); t.focus(); } };
  document.getElementById("prevS").onclick=()=>goS(k-1);
  document.getElementById("nextS").onclick=()=>goS(k+1);
  view.querySelectorAll(".sdot").forEach(b=>b.onclick=()=>goS(+b.dataset.k));
  const sa=document.getElementById("showA"); if(sa) sa.onclick=()=>{ const a=document.getElementById("ga"); a.hidden=!a.hidden; sa.setAttribute("aria-expanded",!a.hidden); sa.textContent=a.hidden?"Afficher la réponse":"Masquer la réponse"; };
  if(sl.trace) setupDnD(view, sl);
}
document.addEventListener("keydown",e=>{
  if(S.cur!=="navire" || /INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName) || document.activeElement.classList.contains("drop")) return;
  const M=MISSIONS.find(m=>m.id==="navire");
  if(e.key==="ArrowRight" && S.guide<M.slides.length-1){ S.guide++; save(); renderGuided(M); }
  if(e.key==="ArrowLeft" && S.guide>0){ S.guide--; save(); renderGuided(M); }
});

/* glisser-déposer : souris, doigt ou clavier */
function setupDnD(view, sl){
  const drops=[...view.querySelectorAll(".drop")], bank=view.querySelector("#bank"), stat=view.querySelector("#tstat");
  const words=[...drops.map(d=>d.dataset.a), ...(sl.distract||[])];
  let order = words.map((w,i)=>i).sort(()=>Math.random()-.5);
  let placed = drops.map(()=>null), sel=null;
  const selChip = w => { sel = sel===w ? null : w; bank.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", +c.dataset.w===sel)); stat.textContent = sel===null ? "" : `« ${words[sel]} » est choisie. Choisissez maintenant un trou.`; };
  const draw=(focusBank)=>{
    const free = order.filter(i=>!placed.includes(i));
    bank.innerHTML = free.map(i=>`<li><span class="chip" data-w="${i}" tabindex="0" role="button" aria-pressed="false">${esc(words[i])}</span></li>`).join("") || `<li>Toutes les étiquettes sont placées.</li>`;
    drops.forEach((d,k)=>{ const w=placed[k]; d.textContent = w===null ? "" : words[w]; d.classList.toggle("full", w!==null); d.classList.remove("ok","ko");
      if(w!==null){ d.dataset.w=w; d.setAttribute("aria-label",`Trou ${k+1} : ${words[w]}. Entrée pour retirer l’étiquette.`); } else { delete d.dataset.w; d.setAttribute("aria-label",`Trou ${k+1}, vide`); } });
    bank.querySelectorAll(".chip").forEach(c=>bindChip(c,false));
    drops.forEach(d=>{ if(d.dataset.w!==undefined) bindChip(d,true); else d.onpointerdown=null; });
    if(focusBank) (bank.querySelector(".chip")||view.querySelector("#chkT")).focus();
  };
  const place=(w,k)=>{ const prev=placed.indexOf(w); if(prev>-1) placed[prev]=null; placed[k]=w; sel=null; draw(false); stat.textContent=`« ${words[w]} » placé dans le trou ${k+1}.`; drops[k].focus(); };
  const unplace=k=>{ const w=placed[k]; placed[k]=null; draw(false); stat.textContent=`« ${words[w]} » est revenue dans les étiquettes.`; drops[k].focus(); };
  function bindChip(el, inDrop){
    el.onpointerdown = e=>{
      if(e.button>0) return; e.preventDefault();
      const w=+el.dataset.w, x0=e.clientX, y0=e.clientY; let ghost=null;
      const move=ev=>{
        if(!ghost && Math.hypot(ev.clientX-x0, ev.clientY-y0)>6){ ghost=document.createElement("span"); ghost.className="chip ghost"; ghost.textContent=words[w]; document.body.appendChild(ghost); }
        if(ghost){ ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px"; drops.forEach(d=>d.classList.remove("hover")); document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".drop")?.classList.add("hover"); }
      };
      const up=ev=>{
        window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
        drops.forEach(d=>d.classList.remove("hover"));
        if(ghost){ ghost.remove(); const d=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".drop");
          if(d) place(w,+d.dataset.i); else if(inDrop) unplace(+el.dataset.i);
        } else if(inDrop){ if(sel!==null) place(sel,+el.dataset.i); else unplace(+el.dataset.i); }
        else selChip(w);
      };
      window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
    };
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault();
      if(inDrop){ if(sel!==null) place(sel,+el.dataset.i); else unplace(+el.dataset.i); } else { selChip(+el.dataset.w); if(sel!==null) drops.find((d,k)=>placed[k]===null)?.focus(); } } };
  }
  drops.forEach(d=>{
    d.addEventListener("click",()=>{ if(d.dataset.w===undefined && sel!==null) place(sel,+d.dataset.i); });
    d.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ") && d.dataset.w===undefined){ e.preventDefault(); if(sel!==null) place(sel,+d.dataset.i); else { stat.textContent="Choisissez d’abord une étiquette."; bank.querySelector(".chip")?.focus(); } } });
  });
  view.querySelector("#chkT").onclick=()=>{
    let ok=0;
    drops.forEach((d,k)=>{ d.classList.remove("ok","ko"); if(placed[k]===null) return; const good = words[placed[k]]===d.dataset.a; d.classList.add(good?"ok":"ko"); d.setAttribute("aria-label",`Trou ${k+1} : ${words[placed[k]]}, ${good?"correct":"incorrect"}`); if(good) ok++; });

  };
  view.querySelector("#rstT").onclick=()=>{ placed=drops.map(()=>null); sel=null; order.sort(()=>Math.random()-.5); draw(true); stat.textContent="Tout est à refaire."; };
  view.querySelector("#allB").onclick=()=>{ placed=drops.map(d=>words.indexOf(d.dataset.a)); draw(false); drops.forEach((d,k)=>{ d.classList.add("ok"); }); stat.textContent="Toutes les réponses sont affichées."; };
  draw(false);
}

/* Word (.docx) fabriqué dans le navigateur, sans bibliothèque */
const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC[(c^u[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  files.forEach(([name,str])=>{
    const nb=enc.encode(name), data=enc.encode(str), c=crc32(data), sz=data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(c),...u32(sz),...u32(sz),...u16(nb.length),...u16(0)]);
    parts.push(lh,nb,data);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(c),...u32(sz),...u32(sz),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+sz;
  });
  const cs=cen.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
function makeDocx(M){
  const x=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const col=M.color.replace("#","");
  const run=(t,o={})=>`<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial"/>${o.b?"<w:b/>":""}${o.c?`<w:color w:val="${o.c}"/>`:""}<w:sz w:val="${o.sz||22}"/></w:rPr>`+String(t).split("\n").map((l,i)=>(i?"<w:br/>":"")+`<w:t xml:space="preserve">${x(l)}</w:t>`).join("")+"</w:r>";
  const par=(r,av,ap)=>`<w:p><w:pPr><w:spacing w:before="${av||0}" w:after="${ap||100}"/></w:pPr>${r}</w:p>`;
  const corps=recapBlocks(M).map(k=>{
    if(k.t==="titre") return par(run(k.x,{b:1,sz:32,c:col}),0,160);
    if(k.t==="id") return par(run(k.x,{b:1}),0,200);
    if(k.t==="h") return par(run(k.x,{b:1,sz:26,c:col}),240,100);
    if(k.t==="q") return par(run(k.l+" : ",{b:1})+run(k.x),0,100);
    return par(run(k.x),0,80);
  }).join("");
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${corps}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  return zip([
    ["[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ["_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ["word/document.xml",doc]
  ]);
}

    const R=bilanRow(M), nm=R.nm;
    h+=`<tr><th scope="row"><span class="mname" style="--c:${M.color};--cl:${M.light}">${ic(M.icon)} ${esc(nm)}</span></th>
    <td><input type="text" data-b="${M.id}" data-k="modes" aria-label="${esc(nm)} : transports" value="${esc(R.modes)}"></td>
    <td><input type="number" min="0" step="0.5" data-b="${M.id}" data-k="h" aria-label="${esc(nm)} : durée en heures" value="${esc(R.h)}"></td>
    <td><input type="number" min="0" data-b="${M.id}" data-k="p" aria-label="${esc(nm)} : prix en euros${M.ref?", "+M.ref.unit:""}" value="${esc(R.p)}">${M.ref?`<small class="unit">${M.ref.unit}</small>`:""}</td>
    <td><input type="text" data-b="${M.id}" data-k="a" aria-label="${esc(nm)} : ce que le trajet montre de Londres" placeholder="Londres est… grâce à…" value="${esc(R.a)}"></td></tr>`;
  });
  h+=`</tbody></table></div>
  <section class="bars" aria-labelledby="b1"><h3 id="b1" class="disp" style="font-size:1.2rem;margin-bottom:6px">Combien de temps pour rejoindre Londres ?</h3><div id="bars"></div></section>
  <section class="bars" aria-labelledby="b2"><h3 id="b2" class="disp" style="font-size:1.2rem;margin-bottom:6px">Combien coûte le voyage ?</h3><p class="cnote" style="margin:0 0 6px">Attention : on ne compare pas la même chose. Les voyageurs paient pour une personne, les marchandises pour tout un camion ou un conteneur.</p><div id="pbars"></div></section>
  <section class="qs" style="margin-top:14px" aria-labelledby="cc"><h3 id="cc">Conclusion de la classe</h3>
    <div class="q"><label for="concl">Londres est connectée au monde grâce à…</label><textarea id="concl">${esc(S.concl)}</textarea>
    <div class="words" role="group" aria-label="Mots utiles à ajouter">${["aéroports internationaux","tunnel sous la Manche","Eurostar","ports","conteneurs","flux de personnes","flux de marchandises","métropole mondiale","interface"].map(w=>`<button type="button" class="word" data-w="${w}" aria-label="Ajouter « ${w} »">+ ${w}</button>`).join("")}</div></div>
  </section>`;
  if(teacher) h+=`<div class="teacher"><h3>Repères enseignant</h3><ul><li>Avion ~7 h · Train ~9 h · Bus ~22 h · Camion 1,5 à 2 jours · Navire 5 à 7 jours.</li><li>Prix : ~2 800 € pour un camion de pélardons, ~2 000 € pour un conteneur de 10 000 pièces, soit quelques centimes par objet transporté.</li><li>« Ce que notre trajet montre de Londres », réponses attendues :<ul>${MISSIONS.map(M=>`<li><b>${esc(M.tab.replace(" (en classe)",""))}</b> : ${esc(M.atout)}</li>`).join("")}</ul></li><li>Idée à faire émerger : plus le trajet est rapide, plus il est cher ; Londres est reliée par tous les modes de transport, pour les personnes comme pour les marchandises.</li></ul></div>`;
  h+=`<div class="actions" style="margin-top:14px"><button class="btn" id="dlAll">${ic("📥")} Télécharger la correction complète</button><button class="btn alt" id="clrB">Remettre le tableau à zéro</button></div>`;
  const view=document.getElementById("view"); view.innerHTML=h;
  view.querySelectorAll("input[data-b]").forEach(inp=>inp.oninput=()=>{ const id=inp.dataset.b; S.bilan[id]=S.bilan[id]||{}; S.bilan[id][inp.dataset.k]=inp.value; save(); drawBars(); });
  const c=document.getElementById("concl"); c.oninput=()=>{ S.concl=c.value; save(); };
  view.querySelectorAll(".word").forEach(b=>b.onclick=()=>{ c.value=(c.value+(c.value&&!/\s$/.test(c.value)?", ":"")+b.dataset.w).trimStart(); S.concl=c.value; save(); c.focus(); });
  document.getElementById("dlAll").onclick=()=>{
    const M=MISSIONS.find(m=>m.id===S.pickM && !m.guided);
    if(teacher || (M && !completion(M).length)) downloadCorrection(hasWork(M) ? M : null);
    else toast("La correction se débloque quand votre mission est terminée (ou avec le code enseignant).");
  };
  document.getElementById("clrB").onclick=()=>{ S.bilan={}; save(); renderBilan(); toast("Tableau remis à zéro."); };
  drawBars();
}
function drawBars(){
  const get = k => MISSIONS.map(M=>{ const inp=document.querySelector(`input[data-b="${M.id}"][data-k="${k}"]`); return {M, v:parseFloat(String(inp?.value).replace(",","."))||0}; });
  const bars = (vals, f, note) => { const max=Math.max(1,...vals.map(x=>x.v));
    return `<ul style="list-style:none;padding:0;margin:0">`+vals.map(({M,v})=>`<li class="bar" style="--c:${M.color}"><span class="n">${ic(M.icon)} ${esc(M.tab.replace(" (en classe)",""))}</span><div class="track" aria-hidden="true"><div class="fill" style="width:${v/max*100}%"></div></div><span class="v">${v? f(v,M) : "non renseigné"}</span></li>`).join("")+`</ul>`+(note||""); };
  document.getElementById("bars").innerHTML = bars(get("h"), v=>fmt(Math.round(v*60)));
  document.getElementById("pbars").innerHTML = bars(get("p"), (v,M)=>eur(v)+(M.ref?" *":""), `<p class="cnote" style="margin:6px 0 0">* par camion ou par conteneur</p>`);
}

/* ---------- minuteur ---------- */
let left=30*60, run=false, iv=null;
const tval=document.getElementById("tval"), tgo=document.getElementById("tgo");
const showT=()=>{ tval.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`; tval.setAttribute("aria-label", `${Math.floor(left/60)} minutes ${left%60} secondes restantes`); document.getElementById("timer").classList.toggle("done",left===0); };
tgo.onclick=()=>{ if(left===0) return; run=!run; tgo.textContent=run?"Pause":"Reprendre";
  if(run){ iv=setInterval(()=>{ if(left>0){ left--; showT(); if(left===300) toast("Plus que 5 minutes."); if(left===0){ clearInterval(iv); run=false; tgo.textContent="Terminé"; toast("Temps écoulé : préparez votre présentation !"); } } },1000); } else clearInterval(iv); };
document.getElementById("tplus").onclick=()=>{ left+=300; if(tgo.textContent==="Terminé") tgo.textContent="Reprendre"; showT(); toast("5 minutes ajoutées."); };
document.getElementById("treset").onclick=()=>{ clearInterval(iv); run=false; left=30*60; tgo.textContent="Démarrer"; showT(); };

(function(){
  const b=document.getElementById("resetAll"); let armed=false, tm=null;
  b.onclick=()=>{
    if(!armed){ armed=true; b.textContent="Cliquez encore pour confirmer"; b.classList.add("danger"); tm=setTimeout(()=>{ armed=false; b.textContent="Effacer mes réponses"; b.classList.remove("danger"); },5000); return; }
    clearTimeout(tm); armed=false; b.textContent="Effacer mes réponses"; b.classList.remove("danger");
    S={cur:S.cur,m:{},bilan:{},ref:S.ref,guide:0,concl:"",level:S.level,focus:{},a11y:S.a11y,pickM:S.pickM,eleve:S.eleve}; save(); render(false); toast("Réponses effacées.");
  };
})();
document.getElementById("tcode").oninput=e=>{ const on=e.target.value.trim().toLowerCase()==="prof"; if(on!==teacher){ teacher=on; render(false); } };

applyA11y(); showT(); render(false);
</script>
</body>
</html>
